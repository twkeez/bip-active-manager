name: Business Profile sync

on:
  schedule:
    # Nightly at 09:10 UTC, staggered clear of the ads (07:10) and social
    # (07:40) jobs so three runs do not contend for the same function limits.
    - cron: "10 9 * * *"
  workflow_dispatch:

concurrency:
  group: gbp-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh Google Business Profile listings and reviews
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::APP_URL and CRON_SECRET repository secrets must both be set."
            exit 1
          fi

          http_status=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 330 \
            -X POST "${APP_URL%/}/api/cron/gbp-sync" \
            -H "Authorization: Bearer ${CRON_SECRET}")

          echo "HTTP ${http_status}"
          cat response.json
          echo

          # 207: some clients failed, most succeeded. Warn, but keep the
          # schedule green — one revoked property is normal and must not read
          # as "the sync is broken".
          if [ "$http_status" = "207" ]; then
            echo "::warning::Some clients failed to sync — see the body above."
            exit 0
          fi

          if [ "$http_status" != "200" ]; then
            echo "::error::gbp-sync failed with HTTP ${http_status}"
            exit 1
          fi
