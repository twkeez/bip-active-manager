name: Job watch

on:
  schedule:
    # Hourly, on a minute clear of the other jobs. Emails Tom about any
    # scheduled job that failed, partly failed, timed out or did not run, and
    # sends a summary each morning (so a missing summary means this job itself
    # has stopped).
    - cron: "47 * * * *"
  workflow_dispatch:

concurrency:
  group: job-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check every scheduled job and email about problems
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::APP_URL and CRON_SECRET repository secrets must both be set."
            exit 1
          fi

          http_status=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 90 \
            -X POST "${APP_URL%/}/api/cron/job-watch" \
            -H "Authorization: Bearer ${CRON_SECRET}")

          echo "HTTP ${http_status}"
          cat response.json
          echo

          if [ "$http_status" != "200" ]; then
            echo "::error::job-watch failed with HTTP ${http_status}"
            exit 1
          fi
